[dependencies]
tera = { version = "1", optional = true }
glob = { version = "0.3", optional = true }
log = "0.4"
async-trait = "0.1.88"
serde = {version = "1.0.219", features = ["derive"]}
serde_json = { version = "1.0" }
schemars = "1.0.4"
thiserror = "2.0.12"
derive_builder = "0.20.2"
futures = "0.3"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
reqwest-eventsource = "0.6.0"
uuid = { version = "1.0", features = ["v4"] }
axum = { version = ">=0.7, <0.9", optional = true }
fastrand = { version = "2", optional = true }
parking_lot = "0.12.5"
base64 = "0.22.1"
aisdk-macros = { package = "vibewindow-aisdk-macros", version = "0.3.0", path = "./macros" }

[dev-dependencies]
cargo-husky = { version = "1", features = ["precommit-hook", "run-cargo-test", "run-cargo-clippy", "run-cargo-fmt"] }
dotenv = "0.15.0"
tempfile = "3.10.1"
wiremock = "0.6.5"

[package.metadata.release]
pre-release-commit-message = "chore: release {{version}}"
pre-release-replacements = [
  {file="CHANGELOG.md", search="Unreleased", replace="{{version}}"},
  {file="CHANGELOG.md", search="\\.\\.\\.HEAD", replace="...{{tag_name}}", exactly=1},
  {file="CHANGELOG.md", search="ReleaseDate", replace="{{date}}"},
  {file="CHANGELOG.md", search="<!-- next-header -->", replace="<!-- next-header -->\n\n## [Unreleased] - ReleaseDate", exactly=1},
  {file="CHANGELOG.md", search="<!-- next-url -->", replace="<!-- next-url -->\n[Unreleased]: https://github.com/hunzhiwange/aisdk/compare/{{tag_name}}...HEAD", exactly=1},
]

