[workspace]
members = [".", "macros"]
resolver = "2"

[package]
name = "vibewindow-aisdk"
version = "0.7.1"
edition = "2024"
license = "MIT"
description = "An open-source Rust library for building AI-powered applications, inspired by the Vercel AI SDK. It provides a robust, type-safe, and easy-to-use interface for interacting with various Large Language Models (LLMs)."
homepage = "https://github.com/hunzhiwange/aisdk"
repository = "https://github.com/hunzhiwange/aisdk"
readme = "README.md"
keywords = ["ai", "sdk", "vibewindow-aisdk", "ai-sdk-rs", "openai"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "aisdk"

